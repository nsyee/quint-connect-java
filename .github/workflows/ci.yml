name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quint CLI
        run: npm i -g @informalsystems/quint

      - name: Quint version
        run: quint --version

      - name: Install Apalache
        shell: bash
        run: |
          curl -sSL -o apalache.zip \
            https://github.com/apalache-mc/apalache/releases/download/v${APALACHE_VERSION}/apalache-${APALACHE_VERSION}.zip
          unzip -q apalache.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apalache-${APALACHE_VERSION}/bin" >> "$GITHUB_PATH"
        env:
          APALACHE_VERSION: 0.62.2

      - name: Apalache version
        run: apalache-mc version

      - name: Build and test
        run: ./gradlew spotlessCheck check --no-daemon

  parity:
    name: parity (Rust quint-connect v0.1.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quint CLI
        run: npm i -g @informalsystems/quint

      - name: Quint version
        run: quint --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parity/rust-harness

      - name: Build Rust reference harness (quint-connect v0.1.2)
        run: cargo build --tests
        working-directory: parity/rust-harness

      - name: Cross-runtime parity tests
        run: ./gradlew :quint-connect-core:parityTest --no-daemon
